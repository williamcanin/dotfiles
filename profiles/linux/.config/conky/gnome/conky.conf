--[[
# Minimalis Conky
# Ajustado para Intel + Nvidia

# Legenda:
# own_window_argb_value - Transparência (0/255)
# own_window_type - desktop: GNOME, overrride: i3.

# Pré uso - comandos:
# sudo pacman -S conky
# echo coretemp | sudo tee /etc/modules-load.d/coretemp.conf
]]

conky.config = {
    alignment = 'top_left',
    background = true,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = 'white',
    default_outline_color = 'white',
    default_shade_color = 'white',
    color1 = '#ffffff',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'Roboto Mono:size=10',
    gap_x = 29,
    gap_y = 55,
    minimum_height = 996,
    minimum_width = 200,
    border_inner_margin = 22,
    border_width = 6,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_x = true,
    own_window = true,
    own_window_class = 'Conky',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 100,
    own_window_type = 'desktop',
    own_window_hints = 'undecorated,sticky,skip_taskbar,skip_pager,below',
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 4,
    update_interval = 1.0,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
}

conky.text = [[
${color1}${font ConkySymbols:size=20}a${font} ${voffset -10}Linux» $hr ${color}
${color1}${goto 70}Distro : ${color}${execi 86400 cat /etc/os-release | grep "PRETTY_NAME" | cut -d= -f2 | sed 's/"//g'}
${color1}${goto 70}Kernel : ${color}$kernel on $machine

${color1}${font ConkySymbols:size=16}f${font} ${voffset -10} System» $hr${color}
${color1}${goto 70}Total  : ${color}${cpu cpu0}% ${alignr}${cpubar 4,100}
${color1}${goto 70}Core 1 : ${color}${freq_g 1}GHz ${alignr}${cpu cpu1}% ${cpubar cpu1 4,100}
${color1}${goto 70}Core 2 : ${color}${freq_g 2}GHz ${alignr}${cpu cpu2}% ${cpubar cpu2 4,100}
${color1}${goto 70}Core 3 : ${color}${freq_g 3}GHz ${alignr}${cpu cpu3}% ${cpubar cpu3 4,100}
${color1}${goto 70}Core 4 : ${color}${freq_g 4}GHz ${alignr}${cpu cpu4}% ${cpubar cpu4 4,100}
${color1}${goto 70}Core 5 : ${color}${freq_g 5}GHz ${alignr}${cpu cpu5}% ${cpubar cpu5 4,100}
${color1}${goto 70}Core 6 : ${color}${freq_g 6}GHz ${alignr}${cpu cpu6}% ${cpubar cpu6 4,100}
${color1}${goto 70}Core 7 : ${color}${freq_g 7}GHz ${alignr}${cpu cpu7}% ${cpubar cpu7 4,100}
${color1}${goto 70}Core 8 : ${color}${freq_g 8}GHz ${alignr}${cpu cpu8}% ${cpubar cpu8 4,100}

${color1}${goto 70}Uptime : ${color}$uptime_short ${alignr}${color1}Load  : ${color}${loadavg}

${color1}${font ConkySymbols:size=16}h${font} ${voffset -10} Temperature» $hr${color}
${color1}${goto 70}CPU    : ${color}${exec sensors -j 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(next(v['Package id 0']['temp1_input'] for k,v in d.items() if 'coretemp' in k))" 2>/dev/null || sensors | grep 'Package id 0' | awk '{print $4}'}°C
# ${color1}${goto 70}GPU    : ${color}${exec nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits 2>/dev/null}°C ${alignr}${color1}VRAM: ${color}${exec nvidia-smi --query-gpu=memory.used,memory.total --format=csv,noheader,nounits 2>/dev/null | awk -F', ' '{printf "%s/%s MiB", $1, $2}'}
# ${color1}${goto 70}GPU Clk: ${color}${exec nvidia-smi --query-gpu=clocks.gr --format=csv,noheader 2>/dev/null} ${alignr}${color1}Fan: ${color}${exec nvidia-smi --query-gpu=fan.speed --format=csv,noheader 2>/dev/null}

${color1}${font ConkySymbols:size=16}J${font} ${voffset -10}Memory» $hr${color}
${color1}${goto 70}RAM  : ${color}$mem/$memmax ${alignr}$memperc% ${membar 4,100}
${color1}${goto 70}SWAP : ${color}$swap/$swapmax ${alignr}$swapperc% ${swapbar 4,100}

${color1}${font ConkySymbols:size=16}n${font} ${voffset -10} Processes» $hr${color}

${color1}${goto 70}CPU usage ${alignr}Memory Usage${color}
${color1}${goto 70}${stippled_hr}${color}
${goto 70}${top name 1} ${color}${top cpu 1}% ${alignr}${top_mem name 1} ${top_mem mem_res 1}
${goto 70}${top name 2} ${color}${top cpu 2}% ${alignr}${top_mem name 2} ${top_mem mem_res 2}
${goto 70}${top name 3} ${color}${top cpu 3}% ${alignr}${top_mem name 3} ${top_mem mem_res 3}
${goto 70}${top name 4} ${color}${top cpu 4}% ${alignr}${top_mem name 4} ${top_mem mem_res 4}
${goto 70}${top name 5} ${color}${top cpu 5}% ${alignr}${top_mem name 5} ${top_mem mem_res 5}

${color1}${goto 70}Processos: ${color}$processes ${color1}Rodando: ${color}$running_processes

${color1}${font ConkySymbols:size=16}k${font} ${voffset -10} Storage» $hr${color}
${color1}${goto 70}/      : ${color}${fs_used /}/${fs_size /} ${alignr}${fs_used_perc /}% ${fs_bar 4,100 /}
${color1}${goto 70}/home  : ${color}${fs_used /home}/${fs_size /home} ${alignr}${fs_used_perc /home}% ${fs_bar 4,100 /home}
${color1}${goto 70}Leitura: ${color}${diskio_read} ${alignr}${color1}Escrita: ${color}${diskio_write}

#${color1}${font ConkySymbols:size=16}b${font} ${voffset -10} Network» $hr${color}
#${color1}${goto 70}IP     : ${color}${addr eno1}
#${color1}${goto 70}Down   : ${color}${downspeed eno1} ${alignr}${color1}Up: ${color}${upspeed eno1}
#${color1}${goto 70}${downspeedgraph eno1 20,90} ${alignr}${upspeedgraph eno1 20,90}

]]
