--[[
# Minimalis Conky
# Author : William Canin

Colors:
White: #ffffff
Arch Linux: #2ea7df
Cianeto: #15ddc2
Purple: #baa1ff
Hacker: #23ea33
]]

conky.config = {
    alignment = 'top_left',
    background = true,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = 'white',
    default_outline_color = 'white',
    default_shade_color = 'white',
    color1 = '#ffffff',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'Roboto Mono:size=10',
    gap_x = 29,
    gap_y = 55,
    minimum_height = 996,
    minimum_width = 200,
    border_inner_margin = 22,
    border_width = 6,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_x = true,
    own_window = true,
    own_window_class = 'Conky',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 115,
    own_window_type = 'override',
    own_window_hints ='undecorated,sticky,skip_taskbar,skip_pager,below',
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 4,
    update_interval = 1.0,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
}

conky.text = [[
${color1}${font ConkySymbols:size=20}a${font} ${voffset -10}Linux» $hr ${color}
${color1}${goto 70}Distro : ${color}${execi 86400 cat `ls -atr /etc/*-release | tail -2` | grep "PRETTY_NAME" | cut -d= -f2 |  sed 's/"//g'}
# ${color1}${goto 70}Distro : ${color}${execi 86400 cat `ls -atr /etc/*-release | tail -2` | grep "DISTRIB_DESCRIPTION" | cut -d= -f2 | sed 's/"//g'}
${color1}${goto 70}Kernel : ${color}$kernel on $machine

${color1}${font ConkySymbols:size=16}f${font} ${voffset -10} System» $hr${color}
${color1}${goto 70}Core 1 : ${color}${freq_g 1}GHz ${alignr}${cpu cpu0}% ${cpubar cpu0 4,100}
${color1}${goto 70}Core 2 : ${color}${freq_g 2}GHz ${alignr}${cpu cpu1}% ${cpubar cpu1 4,100}
${color1}${goto 70}Core 3 : ${color}${freq_g 3}GHz ${alignr}${cpu cpu2}% ${cpubar cpu2 4,100}
${color1}${goto 70}Core 4 : ${color}${freq_g 4}GHz ${alignr}${cpu cpu3}% ${cpubar cpu3 4,100}

${color1}${goto 70}Uptime : ${color}$uptime_short ${alignr}${color1}Load  : ${color}${loadavg}

${color1}${font ConkySymbols:size=16}h${font} ${voffset -10} Temperature» $hr${color}
${color1}${goto 70}CPU : ${color}${exec sensors | grep 'temp1' | awk 'NR==1{print $2}'}
${color1}${goto 70}GPU : ${color}${exec nvidia-smi -q -d TEMPERATURE | grep "GPU Current Temp" | awk 'NR==1{print $5}'}°C
# ${alignr}${color1}GPU : ${color}${exec sensors | grep 'temp1' | awk 'NR==2{print $2}'}

${color1}${font ConkySymbols:size=16}J${font} ${voffset -10}Memory» $hr${color}
${color1}${goto 70}RAM : ${color}$mem/$memmax ${alignr}$memperc% ${membar 4,100}
${color1}${goto 70}SWAP: ${color}$swap/$swapmax $alignr}$swapperc% ${swapbar 4,100}

${color1}${font ConkySymbols:size=16}n${font} ${voffset -10} Processes» $hr${color}

${color1}${goto 70}CPU usage ${alignr}Memory Usage${color}
${color1}${goto 70}${stippled_hr}${color}
${goto 70}${top name 1} ${color}${top cpu 1}% ${alignr}${top_mem name 1}${top_mem mem_res 1}
${goto 70}${top name 2} ${color}${top cpu 2}% ${alignr}${top_mem name 2}${top_mem mem_res 2}
${goto 70}${top name 3} ${color}${top cpu 3}% ${alignr}${top_mem name 3}${top_mem mem_res 3}
${goto 70}${top name 4} ${color}${top cpu 4}% ${alignr}${top_mem name 4}${top_mem mem_res 4}
${goto 70}${top name 5} ${color}${top cpu 5}% ${alignr}${top_mem name 5}${top_mem mem_res 5}

${color1}${goto 70}Processes: ${color}$processes ${color1}Running: ${color}$running_processes

${color1}${font ConkySymbols:size=16}k${font} ${voffset -10} Storage» $hr${color}
${color1}${goto 70}/ : ${color}${fs_used /}/${fs_size /} ${alignr}${fs_used_perc /}% ${fs_bar 4,100 /}
${color1}${goto 70}/home : ${color}${fs_used /home}/${fs_size /home} ${alignr}${fs_used_perc /home}% ${fs_bar 4,100 /home}
${goto 70}

${color1}${font ConkySymbols:size=16}D${font} ${voffset -10}i3wm commands» $hr${color}
${color1}${goto 70}» Mod + Shift + d = ${color} Basic programs
${color1}${goto 70}» Mod + d = ${color} Finder
${color1}${goto 70}» Mod + Enter = ${color} Terminal
${color1}${goto 70}» Mod + 1..8 = ${color} Workspace
${color1}${goto 70}» Mod + <- -> = ${color} Select windows
${color1}${goto 70}» Mod + w = ${color} Windows in tab mode
${color1}${goto 70}» Mod + e = ${color} Side by side
${color1}${goto 70}» Mod + r + <- -> = ${color} Resize window
${color1}${goto 70}» Mod + f = ${color} Fullscreen
${color1}${goto 70}» Mod + Shift + q = ${color} Close window
${color1}${goto 70}» Mod + Shift + Space = ${color} Floating windows
${color1}${goto 85}Mod + Shift = ${color} Move Window
${color1}${goto 70}» Mod + Shift + 1..8 = ${color} Move a window to a workspace
${color1}${goto 70}» Mod + 0 = ${color} Machine states
${color1}${goto 85}e = ${color} Logout
${color1}${goto 85}l = ${color} Lock system
${color1}${goto 85}r = ${color} Restart machine
${color1}${goto 85}h = ${color} Hibernate
${color1}${goto 85}u = ${color} User switch
${color1}${goto 85}s = ${color} Suspense
${color1}${goto 85}Shift + s = ${color} Turn off machine
${color1}${goto 70}» Alt + Shift = ${color} Keyboard layout

# ${color1}${font ConkySymbols:size=16}b${font} ${voffset -10} Wireless» $hr${color}
# ${color1}${goto 70}SSID          : ${color}${wireless_essid wlan0} ${color1}${alignr}Signal: ${color}${wireless_link_qual_perc wlan0}% ${wireless_link_bar 4,100 wlan0}
# ${color1}${goto 70}Bitrate       : ${color}${wireless_bitrate wlan0}
# ${color1}${goto 70}Total Down/Up : ${color}${totaldown wlan0}/${totalup wlan0}
# ${color1}${goto 70}Speed Down/Up : ${color}${downspeed wlan0}/${upspeed wlan0}

]]
